name: Publish

on:
  push:
    tags:
      - "*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Determine npm tag and version
        run: |
          VERSION=${GITHUB_REF_NAME}
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            NPM_TAG='next'
            IS_PRERELEASE=true
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      - name: Sync inter-package versions
        run: node scripts/sync-versions.js

      - name: Check versions are unpublished
        run: |
          PACKAGES=(
            "@ikko-dev/ghost-api"
            "@ikko-dev/ghost-core"
            "@ikko-dev/ghost-sdk"
            "@ikko-dev/ghost-mcp"
          )
          ALREADY_PUBLISHED=()
          for PKG in "${PACKAGES[@]}"; do
            if npm view "${PKG}@${VERSION}" version &>/dev/null; then
              ALREADY_PUBLISHED+=("$PKG@$VERSION")
            fi
          done
          if [ ${#ALREADY_PUBLISHED[@]} -gt 0 ]; then
            echo "The following versions are already published on npm:"
            for P in "${ALREADY_PUBLISHED[@]}"; do echo "  - $P"; done
            echo "Bump the version before re-running publish."
            exit 1
          fi
          echo "All packages at $VERSION are unpublished — proceeding."

      - name: Publish @ikko-dev/ghost-api
        run: npm publish --provenance --access public --tag ${{ env.NPM_TAG }}
        working-directory: packages/api

      - name: Publish @ikko-dev/ghost-core
        run: npm publish --provenance --access public --tag ${{ env.NPM_TAG }}
        working-directory: packages/core

      - name: Publish @ikko-dev/ghost-sdk
        run: npm publish --provenance --access public --tag ${{ env.NPM_TAG }}
        working-directory: packages/sdk

      - name: Publish @ikko-dev/ghost-mcp
        run: npm publish --provenance --access public --tag ${{ env.NPM_TAG }}
        working-directory: packages/mcp

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
