name: Publish

# Release from the Actions tab or with `gh workflow run publish.yml -f bump=patch`.
# npm trusted publishing is configured for this file: keep `npm publish` here.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version --workspaces --include-workspace-root
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@cb24219df8d46e3549a6fe5c10e06f9b01e5011e # 1.0.1
        with:
          command: release
          version: "[${{ steps.version.outputs.version }}]"

      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in the same workflow, from the release tag.
  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Sync inter-package versions
        run: node scripts/sync-versions.js

      - name: Check versions are unpublished
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          PACKAGES=(
            "@ikko-dev/ghost-api"
            "@ikko-dev/ghost-core"
            "@ikko-dev/ghost-sdk"
            "@ikko-dev/ghost-mcp"
          )
          ALREADY_PUBLISHED=()
          for PKG in "${PACKAGES[@]}"; do
            if npm view "${PKG}@${VERSION}" version &>/dev/null; then
              ALREADY_PUBLISHED+=("$PKG@$VERSION")
            fi
          done
          if [ ${#ALREADY_PUBLISHED[@]} -gt 0 ]; then
            echo "The following versions are already published on npm:"
            for P in "${ALREADY_PUBLISHED[@]}"; do echo "  - $P"; done
            echo "Bump the version before re-running publish."
            exit 1
          fi
          echo "All packages at $VERSION are unpublished — proceeding."

      - name: Publish @ikko-dev/ghost-api
        run: npm publish --provenance --access public
        working-directory: packages/api

      - name: Publish @ikko-dev/ghost-core
        run: npm publish --provenance --access public
        working-directory: packages/core

      - name: Publish @ikko-dev/ghost-sdk
        run: npm publish --provenance --access public
        working-directory: packages/sdk

      - name: Publish @ikko-dev/ghost-mcp
        run: npm publish --provenance --access public
        working-directory: packages/mcp

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
